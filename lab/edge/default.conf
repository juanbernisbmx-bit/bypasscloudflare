# Simula el edge de Cloudflare: agrega la cabecera cf-ray a TODO (para que la
# herramienta lo detecte como Cloudflare) y responde una pagina de bloqueo tipo
# "Attention Required" ante accesos directos por IP o Host desconocido.

# Servidor por defecto: pagina de bloqueo (acceso directo a la IP del edge).
server {
    listen 80 default_server;
    server_name _;
    add_header cf-ray "lab00000000000000-LAB" always;
    default_type text/html;
    return 200 '<!doctype html><html><head><title>Attention Required! | Cloudflare</title></head><body><h1>Attention Required!</h1><p>Please enable cookies.</p><p>error 1020: direct ip access not allowed</p><hr>Cloudflare</body></html>';
}

# Apex "protegido": proxy al origen, pero marcado con cf-ray (edge == Cloudflare).
server {
    listen 80;
    server_name bataedu.lab;
    add_header cf-ray "lab11111111111111-LAB" always;
    location / {
        proxy_pass http://172.28.0.20;
        proxy_set_header Host $host;
    }
}
